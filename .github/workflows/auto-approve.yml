name: Auto Approve PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited, converted_to_draft]

concurrency:
  group: auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-approve:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["4alvit","californiantiramisu"]'), github.event.pull_request.user.login) &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
    # Organization-approved metadata-only reviewer; never executes PR code.
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@a087b20d7f474fe4961ccd5c135160bf15f4a9ba
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
