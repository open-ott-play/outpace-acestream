name: CI

# Merge gate for main (#163): rustfmt, Clippy and the offline test suite.
# No path filters, on purpose: when a path filter skips a workflow, its required
# checks stay "Pending" forever and block the pull request.
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels its stale run. Runs on main are
# never cancelled mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The job names are the check contexts that the main ruleset requires.
  # Renaming a job leaves the ruleset waiting on the old name and blocks every PR,
  # so update the ruleset in the same change.
  lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml, with clippy and rustfmt.
      # The bundled Swatinem/rust-cache restores on every run but saves only from
      # main, so pull requests reuse main's cache without filling the cache quota.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          build-warnings: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check deterministic fuzz target formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint deterministic fuzz targets
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

  test:
    name: Rust test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Same toolchain and cache policy as the lint job.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          build-warnings: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      # The RTMP loopback test self-skips without ffmpeg; the hosted image has none.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Live-network tests are #[ignore]d, so the default run stays offline.
      - name: Test
        run: cargo test --workspace --locked

      - name: Replay deterministic fuzz seeds
        run: cargo test --manifest-path fuzz/Cargo.toml --locked

  abcompare:
    name: A/B harness test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check workflow security and source contracts
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-contract"
          "$RUNNER_TEMP/ci-contract/bin/python" -m pip install --only-binary=:all: -r tools/ci/requirements.txt
          "$RUNNER_TEMP/ci-contract/bin/python" -m unittest discover -s tools/ci -v

      # Standard-library fixtures and loopback HTTP only; no public stream or Docker.
      - name: Test A/B capture and analysis
        run: python3 -m unittest discover -s tools/abcompare -v

      - name: Test source context isolation
        run: python3 -m unittest discover -s tools/source -v

      - name: Test release archive verification
        run: python3 -m unittest discover -s tools/release -v

  hls-audio-synthetic:
    name: HLS audio synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          build-warnings: ""
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install synthetic media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # The opted-in suite verifies every required encoder/generator and ffprobe;
      # missing tools or capabilities are failures, never successful skips.
      - name: Synthetic codec and lifecycle acceptance
        env:
          OUTPACE_TEST_HLS_AUDIO_FFMPEG: "1"
        run: cargo test -p ace-engine --test hls_audio_ffmpeg --locked -- --nocapture

      - name: Retained replay with decoded media and independent viewers
        run: cargo test -p ace-engine --test media_history --locked generated_media_rewinds_decodes_and_returns_live_without_moving_another_viewer -- --ignored --exact --nocapture
