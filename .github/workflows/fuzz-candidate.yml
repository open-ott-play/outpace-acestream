name: RC fuzz assessment

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Explicit source release-candidate assessment
        type: choice
        options: [rc]
        default: rc
        required: true

permissions:
  contents: read

concurrency:
  group: rc-fuzz-assessment
  cancel-in-progress: false

jobs:
  fuzz:
    if: >-
      github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@f510d3b282d5fac9173b10b0ddedb9535c767ac9
    with:
      toolkit-ref: f510d3b282d5fac9173b10b0ddedb9535c767ac9
      evidence-mode: candidate
