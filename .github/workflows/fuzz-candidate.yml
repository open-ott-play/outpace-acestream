name: RC fuzz assessment

on:
  workflow_call:
    inputs:
      channel:
        description: Channel selected by the calling release workflow
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rc-fuzz-assessment-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fuzz:
    if: >-
      github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@6f0bf114a398f9c2b7e5407042c3828a8cc28b40 # main
    with:
      toolkit-ref: 6f0bf114a398f9c2b7e5407042c3828a8cc28b40
      evidence-mode: candidate
