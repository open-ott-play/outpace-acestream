name: RC fuzz assessment

on:
  workflow_call:
    inputs:
      channel:
        description: Channel selected by the calling release workflow
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: rc-fuzz-assessment-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  fuzz:
    if: >-
      github.event.repository.private == false && github.event_name == 'workflow_dispatch' && inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@d4b21d156067ce58f89f89149bfad545e1889ae7 # main
    with:
      toolkit-ref: d4b21d156067ce58f89f89149bfad545e1889ae7
      evidence-mode: candidate
