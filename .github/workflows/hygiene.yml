name: hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identifiers:
    name: acestream identifier hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan tracked files for real AceStream identifiers
        run: python3 tools/hygiene/check_identifiers.py
