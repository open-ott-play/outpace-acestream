name: hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identifiers:
    name: acestream identifier hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan tracked files for real AceStream identifiers
        run: python3 tools/hygiene/check_identifiers.py
