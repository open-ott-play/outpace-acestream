name: Publish release container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (vX.Y.Z or vX.Y.Z-beta.N)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Versioned tags and their latest/beta channel publish together, without overlap.
concurrency:
  group: outpace-release-container-publication
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/open-ott-play/outpace-acestream

jobs:
  prepare:
    name: Verify release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      channel: ${{ steps.release.outputs.channel }}
      tooling_revision: ${{ steps.release.outputs.tooling_revision }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # An existing release can predate this workflow. Publication tooling comes
      # from main; the requested tag determines assets, version and revision.
      - name: Checkout publication tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate published release and resolve its commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/release_policy.py metadata "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease > release.json
          python3 tools/release/release_policy.py published "$RELEASE_TAG" release.json
          # The commits endpoint dereferences both lightweight and annotated tags.
          revision="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Could not resolve the release commit'
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "tooling_revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download and verify the complete release archive set
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets \
            --pattern 'outpace-*' --pattern SHA256SUMS
          python3 tools/release/prepare_container.py "$RELEASE_TAG" release-assets container-context "${{ steps.release.outputs.revision }}"
          cp Dockerfile.release container-context/Dockerfile

      - name: Upload verified runtime context
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-container-context
          path: container-context
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build runtime image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # GitHub has no hosted native ARMv7 runner. Only this platform uses
          # QEMU, for the short Debian runtime package installation; no Rust.
          - arch: arm-v7
            platform: linux/arm/v7
            runner: ubuntu-24.04
    steps:
      - name: Download verified runtime context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-container-context
          path: container-context

      # Artifact downloads normalize permissions; restore the verified binaries.
      - name: Restore executable permissions
        run: chmod 755 container-context/amd64/outpace container-context/arm64/outpace container-context/arm-v7/outpace

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for ARMv7 only
        if: matrix.arch == 'arm-v7'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Push immutable image digests only. Public tags are created after every
      # platform succeeds, so a failed platform cannot publish a partial index.
      - name: Build and push runtime image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: container-context
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
          cache-from: type=gha,scope=release-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-runtime-${{ matrix.arch }}

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Expected an immutable image digest'
            exit 1
          fi
          mkdir digests
          touch "digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-container-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish complete three-platform index
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout the same publication tooling used for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tooling_revision }}
          persist-credentials: false

      - name: Download all platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-container-digest-*
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Prevent an older release from replacing its channel
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq 'add' > releases.json
          python3 tools/release/release_policy.py channel "$RELEASE_TAG" releases.json

      - name: Publish version and its channel as the same complete index
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for digest in digests/*; do
            hash="${digest##*/}"
            if [[ ! "$hash" =~ ^[0-9a-f]{64}$ || ! -f "$digest" ]]; then
              echo '::error::Invalid platform image digest'
              exit 1
            fi
            sources+=("${IMAGE_NAME}@sha256:${hash}")
          done
          if [[ "${#sources[@]}" != 3 ]]; then
            echo '::error::Expected exactly three successful platform images'
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${RELEASE_VERSION}" \
            --tag "${IMAGE_NAME}:${RELEASE_CHANNEL}" \
            "${sources[@]}"
