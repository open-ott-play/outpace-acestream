name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Validate a source release candidate (includes mandatory fuzzing)
        type: choice
        options: [rc]
        default: rc
        required: true
      expected_sha:
        description: Optional exact main commit; fail if the branch moved
        type: string
        required: false
  push:
    tags:
      - "v*.*.*"
      - "!v*.*.*-*"
      - "v*.*.*-beta.*"

permissions:
  contents: read

# A retry for the same tag must not race draft upload/publication.
concurrency:
  group: outpace-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN_NAME: outpace
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/open-ott-play/outpace-acestream

jobs:
  rc-request:
    name: Validate RC request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 tools/release/rc_gate.py request

  rc-checks:
    needs: rc-request
    uses: ./.github/workflows/ci.yml

  rc-hygiene:
    needs: rc-request
    uses: ./.github/workflows/hygiene.yml

  rc-security:
    needs: rc-request
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml

  rc-fuzz:
    needs: rc-request
    uses: ./.github/workflows/fuzz-candidate.yml
    with:
      channel: ${{ inputs.channel }}

  rc-gate:
    name: RC gate
    needs: [rc-request, rc-checks, rc-hygiene, rc-security, rc-fuzz]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every RC stage to succeed
        env:
          RC_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/release/rc_gate.py jobs
      - name: Download fuzz evidence from this run and attempt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fuzz-candidate-${{ github.run_attempt }}
          path: rc-evidence
      - name: Bind successful RC to its exact source and fuzz targets
        run: python3 tools/release/rc_gate.py report rc-evidence/fuzz-report.json --output rc-evidence/rc-result.json
      - name: Retain verified source RC result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-rc-${{ github.run_attempt }}
          path: rc-evidence/*.json
          if-no-files-found: error
          retention-days: 90

  release-metadata:
    name: Validate release tag against Cargo metadata
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read Cargo version and validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          cargo_version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "ace-engine") | .version')"

          if [[ -z "$cargo_version" || "$cargo_version" == "null" ]]; then
            echo "::error::Could not read the ace-engine version from cargo metadata."
            exit 1
          fi

          python3 tools/release/release_policy.py metadata "$GITHUB_REF_NAME" \
            --cargo-version "$cargo_version" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          target: ${{ matrix.target }}
          cache: false
          build-warnings: ""

      - name: Install Linux cross toolchain
        if: contains(matrix.target, 'unknown-linux-musl')
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        with:
          target: ${{ matrix.target }}

      - name: Test Windows executable resolution
        if: contains(matrix.target, 'windows')
        shell: bash
        run: cargo test --locked -p ace-engine --lib --target "${{ matrix.target }}" executable_resolution_tests

      - name: Build release binary
        env:
          OUTPACE_RELEASE_BUILD: "1"
        shell: bash
        run: |
          cargo build --locked --release -p ace-engine --bin "$BIN_NAME" --target "${{ matrix.target }}" --message-format=json-render-diagnostics > cargo-build.json

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-metadata.outputs.version }}"
          target="${{ matrix.target }}"
          binary="target/${target}/release/${BIN_NAME}"

          if [[ "$target" == *windows* ]]; then
            binary="${binary}.exe"
          fi

          package_dir="dist/${BIN_NAME}-${version}-${target}"
          mkdir -p "$package_dir"
          cp "$binary" "$package_dir/"
          cp LICENSE NOTICE AUTHORS.md README.md "$package_dir/"
          python3 tools/release/package_source.py cargo-build.json "$package_dir"
          revision="$(git rev-parse HEAD)"
          python3 tools/source/complete_source.py "$package_dir" "dist/outpace-source-${version}-${target}-${revision}.tar.gz"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            python3 -m zipfile -c "dist/${BIN_NAME}-${version}-${target}.zip" "$package_dir"
          else
            tar -C dist -czf "dist/${BIN_NAME}-${version}-${target}.tar.gz" "${BIN_NAME}-${version}-${target}"
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/${{ env.BIN_NAME }}-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/outpace-source-${{ needs.release-metadata.outputs.version }}-${{ matrix.target }}-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    # Builds remain concurrent, but the fresh Latest decision and publication
    # must not race another tag's publication in this workflow.
    concurrency:
      group: outpace-github-release-publication
      cancel-in-progress: false
    needs:
      - release-metadata
      - build-binaries
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download packaged binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum outpace-* > SHA256SUMS
          cat SHA256SUMS

      - name: Validate every binary and corresponding source before publication
        shell: bash
        run: |
          python3 tools/release/prepare_container.py \
            "$GITHUB_REF_NAME" dist "$RUNNER_TEMP/validated-release" "$GITHUB_SHA"

      - name: Keep every existing published release immutable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq 'add' > releases.json
          python3 tools/release/release_policy.py unpublished "$GITHUB_REF_NAME" releases.json

      # Both channels upload and verify all assets before making them public.
      # Only the same-channel unpublished draft may be resumed on a retry.
      - name: Upload release draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.release-metadata.outputs.prerelease }}
          draft: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/outpace-*
            dist/SHA256SUMS

      - name: Verify uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease > draft-release.json
          python3 tools/release/release_policy.py draft "$GITHUB_REF_NAME" draft-release.json
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/draft-release-assets" --pattern '*'
          python3 tools/release/prepare_container.py "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/draft-release-assets" "$RUNNER_TEMP/validated-draft-upload" "$GITHUB_SHA"

      - name: Select Latest from the current published releases
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | jq 'add' > releases-before-publication.json
          python3 tools/release/release_policy.py publication "$GITHUB_REF_NAME" \
            releases-before-publication.json >> "$GITHUB_OUTPUT"

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MAKE_LATEST: ${{ steps.publication.outputs.make_latest }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$PRERELEASE" --latest="$MAKE_LATEST" --verify-tag
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,isPrerelease > published-release.json
          python3 tools/release/release_policy.py published "$GITHUB_REF_NAME" published-release.json

  publish-container:
    name: Publish GHCR image from release archives
    # publish-release depends on all seven binary builds succeeding.
    needs: publish-release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      tag: ${{ github.ref_name }}
