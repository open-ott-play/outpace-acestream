name: Security analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    if: github.event.repository.private == false
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@2fead769a8be42256408bd1a8166b6efa2ffa3b8 # main
    with:
      languages: rust,python,actions
