name: Security analysis

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    if: github.event.repository.private == false
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@6f0bf114a398f9c2b7e5407042c3828a8cc28b40 # main
    with:
      languages: rust,python,actions
