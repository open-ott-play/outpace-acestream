<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="672" viewBox="0 0 1120 672" role="img" aria-labelledby="title desc">
  <title id="title">Outpace AceStream deployment shapes</title>
  <desc id="desc">The same Rust engine runs as a native process, a container, or a Kubernetes or k3s workload. Preserve identity data, give caches a writable path, and choose API exposure explicitly. Deployment packaging does not change media or source-offer semantics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132c43"/><stop offset="1" stop-color="#091320"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ad9ed"/><stop offset="1" stop-color="#89e5b0"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6ad9ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="1118" height="670" rx="24" fill="url(#background)" stroke="#304860"/>
  <path d="M25 2H1095" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
<text x="44" y="49" fill="#6ad9ed" font-size="14" font-weight="700">DEPLOYMENT MAP</text>
<text x="44" y="95" fill="#f0f6ff" font-size="34" font-weight="700">One engine, three operating shapes</text>
<text x="44" y="130" fill="#b4c5d8" font-size="19" font-weight="400">Choose the lifecycle manager that fits the host. Keep storage and network intent explicit.</text>
<rect x="40" y="178" width="306" height="307" rx="16" fill="#13253b" stroke="#304860"/>
<text x="63" y="216" fill="#89e5b0" font-size="16" font-weight="700">01</text>
<text x="63" y="259" fill="#f0f6ff" font-size="25" font-weight="700">Native binary</text>
<text x="63" y="291" fill="#6ad9ed" font-size="17" font-weight="400">Linux · macOS · Windows</text>
<path d="M63 312H323" stroke="#304860"/>
<text x="63" y="345" fill="#b4c5d8" font-size="18" font-weight="400">outpace serve</text>
<text x="63" y="380" fill="#b4c5d8" font-size="18" font-weight="400">OS service manager optional</text>
<text x="63" y="415" fill="#b4c5d8" font-size="18" font-weight="400">Persistent data directory</text>
<text x="63" y="450" fill="#b4c5d8" font-size="18" font-weight="400">Loopback HTTP by default</text>
<rect x="407" y="178" width="306" height="307" rx="16" fill="#13253b" stroke="#304860"/>
<text x="430" y="216" fill="#89e5b0" font-size="16" font-weight="700">02</text>
<text x="430" y="259" fill="#f0f6ff" font-size="25" font-weight="700">Container</text>
<text x="430" y="291" fill="#6ad9ed" font-size="17" font-weight="400">Docker / Compose</text>
<path d="M430 312H690" stroke="#304860"/>
<text x="430" y="345" fill="#b4c5d8" font-size="18" font-weight="400">Published release binary</text>
<text x="430" y="380" fill="#b4c5d8" font-size="18" font-weight="400">Persistent data volume</text>
<text x="430" y="415" fill="#b4c5d8" font-size="18" font-weight="400">Writable private cache path</text>
<text x="430" y="450" fill="#b4c5d8" font-size="18" font-weight="400">Explicit host port mapping</text>
<rect x="774" y="178" width="306" height="307" rx="16" fill="#13253b" stroke="#304860"/>
<text x="797" y="216" fill="#89e5b0" font-size="16" font-weight="700">03</text>
<text x="797" y="259" fill="#f0f6ff" font-size="25" font-weight="700">Cluster workload</text>
<text x="797" y="291" fill="#6ad9ed" font-size="17" font-weight="400">Kubernetes / k3s</text>
<path d="M797 312H1057" stroke="#304860"/>
<text x="797" y="345" fill="#b4c5d8" font-size="18" font-weight="400">Deployment + Service + PVC</text>
<text x="797" y="380" fill="#b4c5d8" font-size="18" font-weight="400">One writer per identity</text>
<text x="797" y="415" fill="#b4c5d8" font-size="18" font-weight="400">Pin the image by digest</text>
<text x="797" y="450" fill="#b4c5d8" font-size="18" font-weight="400">Probes + controlled rollout</text>
<rect x="40" y="516" width="1040" height="112" rx="16" fill="#172e39" stroke="#46605d"/>
<text x="62" y="553" fill="#89e5b0" font-size="14" font-weight="700">PRESERVE</text>
<text x="204" y="553" fill="#f0f6ff" font-size="20" font-weight="400">Node identity, validated settings and a known rollback point.</text>
<text x="62" y="592" fill="#6ad9ed" font-size="14" font-weight="700">VERIFY</text>
<text x="204" y="592" fill="#f0f6ff" font-size="20" font-weight="400">Health + build source + actual media decoding after a change.</text>
</g></svg>
