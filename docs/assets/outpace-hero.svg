<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Outpace AceStream</title>
  <desc id="desc">An independently maintained Rust engine for live AceStream delivery, with native MPEG-TS and HLS output, derived from Outpace under AGPL-3.0-or-later.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132c43"/><stop offset="1" stop-color="#091320"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ad9ed"/><stop offset="1" stop-color="#89e5b0"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6ad9ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="1118" height="418" rx="24" fill="url(#background)" stroke="#304860"/>
  <path d="M25 2H1095" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
<text x="58" y="61" fill="#6ad9ed" font-size="15" font-weight="700">OPEN SOURCE  /  RUST ENGINE</text>
<text x="58" y="149" fill="#f0f6ff" font-size="56" font-weight="700">Outpace AceStream</text>
<text x="58" y="204" fill="#f0f6ff" font-size="28" font-weight="400">Live streams. Native delivery.</text>
<text x="58" y="245" fill="#b4c5d8" font-size="20" font-weight="400">From public AceStream peers to MPEG-TS and HLS.</text>
<text x="58" y="276" fill="#b4c5d8" font-size="20" font-weight="400">Use your player, your proxy, and your deployment.</text>
<rect x="58" y="309" width="163" height="39" rx="19" fill="#173247" stroke="#35546b"/>
<text x="139.5" y="334" fill="#89e5b0" font-size="13" font-weight="700" text-anchor="middle">NATIVE TS + HLS</text>
<rect x="233" y="309" width="171" height="39" rx="19" fill="#173247" stroke="#35546b"/>
<text x="318.5" y="334" fill="#89e5b0" font-size="13" font-weight="700" text-anchor="middle">BOUNDED MEDIA</text>
<rect x="416" y="309" width="154" height="39" rx="19" fill="#173247" stroke="#35546b"/>
<text x="493.0" y="334" fill="#89e5b0" font-size="13" font-weight="700" text-anchor="middle">SELF-HOSTED</text>
<text x="58" y="386" fill="#b4c5d8" font-size="15" font-weight="400">Built on Outpace · Independently maintained · AGPL-3.0-or-later</text>
