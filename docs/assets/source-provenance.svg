<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Outpace AceStream binary and source provenance</title>
  <desc id="desc">Build inputs produce a release binary containing its workspace source archive and metadata, plus a complete corresponding-source bundle with locked dependencies and notices. At runtime, source.json and source.tar.gz identify the running build. Compare its identities and checksums with the released artifacts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132c43"/><stop offset="1" stop-color="#091320"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ad9ed"/><stop offset="1" stop-color="#89e5b0"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 5L1 9" fill="none" stroke="#6ad9ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="1118" height="698" rx="24" fill="url(#background)" stroke="#304860"/>
  <path d="M25 2H1095" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif">
<text x="44" y="49" fill="#6ad9ed" font-size="14" font-weight="700">SOURCE PROVENANCE</text>
<text x="44" y="95" fill="#f0f6ff" font-size="34" font-weight="700">Know what is running</text>
<text x="44" y="130" fill="#b4c5d8" font-size="19" font-weight="400">Release binaries and their corresponding source are verified and distributed together.</text>
<rect x="40" y="184" width="304" height="240" rx="16" fill="#13253b" stroke="#304860"/>
<text x="62" y="222" fill="#89e5b0" font-size="14" font-weight="700">01 / INPUTS</text>
<text x="62" y="268" fill="#f0f6ff" font-size="26" font-weight="700">Build inputs</text>
<text x="62" y="313" fill="#b4c5d8" font-size="18" font-weight="400">Tracked workspace</text>
<text x="62" y="347" fill="#b4c5d8" font-size="18" font-weight="400">Cargo.lock + build scripts</text>
<text x="62" y="381" fill="#b4c5d8" font-size="18" font-weight="400">Original license notices</text>
<rect x="408" y="184" width="304" height="240" rx="16" fill="#13253b" stroke="#304860"/>
<text x="430" y="222" fill="#89e5b0" font-size="14" font-weight="700">02 / RELEASE</text>
<text x="430" y="268" fill="#f0f6ff" font-size="26" font-weight="700">Paired artifacts</text>
<text x="430" y="313" fill="#b4c5d8" font-size="18" font-weight="400">Binary + embedded source</text>
<text x="430" y="347" fill="#b4c5d8" font-size="18" font-weight="400">Complete vendored source</text>
<text x="430" y="381" fill="#b4c5d8" font-size="18" font-weight="400">SHA256SUMS + notices</text>
<rect x="776" y="184" width="304" height="240" rx="16" fill="#13253b" stroke="#304860"/>
<text x="798" y="222" fill="#89e5b0" font-size="14" font-weight="700">03 / RUNTIME</text>
<text x="798" y="268" fill="#f0f6ff" font-size="26" font-weight="700">Source offer</text>
<text x="798" y="313" fill="#b4c5d8" font-size="18" font-weight="400">/source.json — identity</text>
<text x="798" y="347" fill="#b4c5d8" font-size="18" font-weight="400">/source.tar.gz — workspace</text>
<text x="798" y="381" fill="#b4c5d8" font-size="18" font-weight="400">/source — download links</text>
<path d="M345 298H404" fill="none" stroke="#6ad9ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M713 298H772" fill="none" stroke="#6ad9ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="460" width="1040" height="138" rx="16" fill="#172e39" stroke="#46605d"/>
<text x="62" y="498" fill="#89e5b0" font-size="14" font-weight="700">COMPARE THE RUNNING BUILD</text>
<text x="62" y="534" fill="#f0f6ff" font-size="24" font-weight="700">Version · revision · target · tree state · embedded workspace SHA-256</text>
<text x="62" y="570" fill="#b4c5d8" font-size="18" font-weight="400">Preserve the source links when proxying the engine. Modified builds need matching source.</text>
<text x="42" y="644" fill="#b4c5d8" font-size="16" font-weight="400">AGPL-3.0-or-later · Upstream attribution retained · Source identity is not a bit-for-bit rebuild guarantee</text>
</g></svg>
