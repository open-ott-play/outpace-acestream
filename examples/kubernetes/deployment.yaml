apiVersion: apps/v1
kind: Deployment
metadata:
  name: outpace
  labels:
    app.kubernetes.io/name: outpace
spec:
  replicas: 1
  # One process owns this PVC and node identity. Do not overlap old/new pods.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: outpace
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outpace
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outpace
          # Verify publication; pin its reviewed index digest for production.
          image: ghcr.io/open-ott-play/outpace-acestream:0.9.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 6878
              protocol: TCP
          env:
            - name: OUTPACE_BIND
              value: 0.0.0.0:6878
            - name: OUTPACE_RTMP_BIND
              value: 127.0.0.1:1935
            - name: OUTPACE_DATA_DIR
              value: /var/lib/outpace
            # Required with a custom data root on v0.8.1, even in memory mode.
            - name: OUTPACE_CACHE_DIR
              value: /var/lib/outpace/cache
            - name: OUTPACE_CACHE_TYPE
              value: memory
            # Enable the supported /ace/* subset for existing middleware.
            - name: OUTPACE_ACE_COMPAT
              value: "1"
            # Outbound P2P works without publishing an inbound peer endpoint.
            - name: OUTPACE_ENABLE_INBOUND
              value: "0"
            - name: OUTPACE_ENABLE_SEEDING
              value: "1"
            - name: OUTPACE_ENABLE_PORT_MAPPING
              value: "0"
          volumeMounts:
            - name: data
              mountPath: /var/lib/outpace
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Starting values, not a guarantee for every bitrate/client count.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: outpace-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
