[package]
name = "outpace-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "AGPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

# Keep fuzz-only tooling out of the product dependency graph and release build.
[workspace]
members = ["."]

[features]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
ace-wire = { path = "../crates/ace-wire" }
ace-media = { path = "../crates/ace-media" }
libfuzzer-sys = { version = "=0.4.13", optional = true }

[[bin]]
name = "metadata"
path = "fuzz_targets/metadata.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "peer_frames"
path = "fuzz_targets/peer_frames.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "peer_extensions"
path = "fuzz_targets/peer_extensions.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "media_resync"
path = "fuzz_targets/media_resync.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "hls_playlist"
path = "fuzz_targets/hls_playlist.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]
